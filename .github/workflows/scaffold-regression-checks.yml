name: Scaffold Regression Checks

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scaffold/**"
      - "scripts/check-scaffold-markdown-whitespace.sh"
      - "scripts/test-scaffold-markdown-whitespace.sh"
      - "scripts/test-root-readme-seeding.sh"
      - "scripts/new-project.sh"
      - "scripts/update-project.sh"
      - "scripts/test-gitignore-management.sh"
      - "scripts/test-coding-standards-sync.sh"
      - "scripts/test-decision-template-sync.sh"
      - "scripts/test-context-log-policy-sync.sh"
      - "scripts/test-session-metadata-hook.sh"
      - "scripts/test-memory-budget-hook.sh"
      - "scripts/test-main-push-gate.sh"
      - "scripts/test-bash-compatibility.sh"
      - "scripts/test-session-start-load-contract.sh"
      - "scripts/test-agent-memory-load-measurement.sh"
      - "scripts/test-parse-claude-memory-trace.sh"
      - "scripts/test-path-expansion.sh"
      - "scripts/test-new-worktree.sh"
      - "scripts/test-remove-worktree.sh"
      - "scripts/test-worktree-helper-sync.sh"
      - "scripts/lib/**"
      - "scripts/measure-agent-memory-load.sh"
      - "scripts/parse-claude-memory-trace.py"
      - "scripts/test-check-memory-budget.sh"
      - "scripts/test-context-log-size-budget.sh"
      - "scripts/test-byte-context-log-retention.sh"
      - "scripts/test-context-log-growth.sh"
      - "scripts/test-memory-import-discovery.sh"
      - "scripts/fixtures/memory-imports/**"
      - "scripts/test-check-context-log-rollover.sh"
      - "scripts/test-check-lessons-archive.sh"
      - "scripts/test-compact-context-log.sh"
      - "scripts/test-markdown-fences.sh"
      - ".github/workflows/scaffold-regression-checks.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "scaffold/**"
      - "scripts/check-scaffold-markdown-whitespace.sh"
      - "scripts/test-scaffold-markdown-whitespace.sh"
      - "scripts/test-root-readme-seeding.sh"
      - "scripts/new-project.sh"
      - "scripts/update-project.sh"
      - "scripts/test-gitignore-management.sh"
      - "scripts/test-coding-standards-sync.sh"
      - "scripts/test-decision-template-sync.sh"
      - "scripts/test-context-log-policy-sync.sh"
      - "scripts/test-session-metadata-hook.sh"
      - "scripts/test-memory-budget-hook.sh"
      - "scripts/test-main-push-gate.sh"
      - "scripts/test-bash-compatibility.sh"
      - "scripts/test-session-start-load-contract.sh"
      - "scripts/test-agent-memory-load-measurement.sh"
      - "scripts/test-parse-claude-memory-trace.sh"
      - "scripts/test-path-expansion.sh"
      - "scripts/test-new-worktree.sh"
      - "scripts/test-remove-worktree.sh"
      - "scripts/test-worktree-helper-sync.sh"
      - "scripts/lib/**"
      - "scripts/measure-agent-memory-load.sh"
      - "scripts/parse-claude-memory-trace.py"
      - "scripts/test-check-memory-budget.sh"
      - "scripts/test-context-log-size-budget.sh"
      - "scripts/test-byte-context-log-retention.sh"
      - "scripts/test-context-log-growth.sh"
      - "scripts/test-memory-import-discovery.sh"
      - "scripts/fixtures/memory-imports/**"
      - "scripts/test-check-context-log-rollover.sh"
      - "scripts/test-check-lessons-archive.sh"
      - "scripts/test-compact-context-log.sh"
      - "scripts/test-markdown-fences.sh"
      - ".github/workflows/scaffold-regression-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-regression-checks:
    strategy:
      # Run both platforms to completion: BSD-vs-GNU userland differences are
      # exactly what the macOS job exists to catch (a GNU-only `find -printf`
      # once made AGENTS.md discovery silently return nothing on macOS), so an
      # Ubuntu failure must not cancel the macOS evidence or vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: current
          - os: macos-latest
            bash: current
          - os: ubuntu-24.04
            bash: "4.4"
    runs-on: ${{ matrix.os }}
    name: scaffold-regression-checks (${{ matrix.os }}, Bash ${{ matrix.bash }})
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision pinned Bash 4.4.12 on native Ubuntu
        if: matrix.bash == '4.4'
        # Extract two files only. The suite still uses Ubuntu's Git, awk,
        # coreutils, and libc, not the historical container's userland.
        # Test-only, linux/amd64 artifacts; never install into system paths.
        # If this digest disappears, replace it with reviewed, checksum-pinned
        # Bash 4.4.x + libtinfo artifacts compatible with native Ubuntu. Do not
        # silently switch to an Alpine/BusyBox lane or skip the minimum runtime.
        run: |
          image='buildpack-deps@sha256:78e995165a5788c2f55aed6e548d8f6c1534830d4310c870408fccb2da8c5b2e'
          timeout 180 docker pull --platform linux/amd64 "$image"
          bash44_dir="$(mktemp -d "$RUNNER_TEMP/bash44.XXXXXX")"
          mkdir "$bash44_dir/bin" "$bash44_dir/lib"
          bash44_container="$(docker create --platform linux/amd64 "$image")"
          trap 'docker rm "$bash44_container" >/dev/null' EXIT
          docker cp "$bash44_container:/bin/bash" "$bash44_dir/bin/bash"
          docker cp "$bash44_container:/lib/x86_64-linux-gnu/libtinfo.so.5.9" "$bash44_dir/lib/libtinfo.so.5"
          printf '%s  %s\n' \
            '3f0bc167fa8ef1f7a38452a5fd16d077ed8ef657bb81cdce5af9537ca96e8345' "$bash44_dir/bin/bash" \
            '33626a82c73c983b4bd872e80cd9d8965eb6d985ac82d53fa1d3a21ccd4a2c27' "$bash44_dir/lib/libtinfo.so.5" |
            sha256sum -c -
          LD_LIBRARY_PATH="$bash44_dir/lib" "$bash44_dir/bin/bash" -euc '
            [[ $BASH_VERSION == 4.4.12* ]]
            a=(); for item in "${a[@]}"; do :; done
            echo "Provisioned $BASH: $BASH_VERSION"
          '
          echo "$bash44_dir/bin" >> "$GITHUB_PATH"
          # Inherit the isolated library path for env-bash shebangs and direct
          # "$BASH" children too. It contains only libtinfo.so.5; no libc or
          # current Ubuntu library is replaced. This applies only to this job.
          echo "LD_LIBRARY_PATH=$bash44_dir/lib" >> "$GITHUB_ENV"
      - name: Ensure Bash 4.4+ on macOS (Apple ships Bash 3.2)
        if: runner.os == 'macOS'
        # Assert against the exact Homebrew binary, not bare "bash": this
        # step's shell hashes "bash" to /bin/bash on first use, so a bare
        # post-install "bash --version" reports 3.2 even after a successful
        # install and cannot prove the postcondition.
        run: |
          brew_bin="$(brew --prefix)/bin"
          if [ ! -x "$brew_bin/bash" ]; then
            brew install bash
          fi
          echo "$brew_bin" >> "$GITHUB_PATH"
          "$brew_bin/bash" -c '((BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4)))'
          "$brew_bin/bash" --version | head -1
      - name: Verify the actual suite and child interpreter (all lanes)
        env:
          EXPECTED_TEST_BASH: ${{ matrix.bash }}
        # Fresh step, fresh shell: bare "bash" here resolves exactly as it
        # will in every suite step below, so this asserts what the suites
        # actually run with (not just that a modern bash exists somewhere).
        run: |
          command -v bash
          bash -euc '
            echo "suite bash: $BASH ($BASH_VERSION)"
            ((BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4)))
            if [[ "$EXPECTED_TEST_BASH" == 4.4 ]]; then
              [[ $BASH_VERSION == 4.4.12* ]]
            fi
            "$BASH" -c '\''echo "child bash: $BASH ($BASH_VERSION)"'\''
          '
          git --version
      - name: Verify Bash compatibility contract
        run: bash scripts/test-bash-compatibility.sh
      - name: Verify stock Bash 3.2 hooks and unsupported helpers (macOS)
        if: runner.os == 'macOS'
        env:
          HOOK_TEST_BASH: /bin/bash
          UNSUPPORTED_TEST_BASH: /bin/bash
        run: |
          /bin/bash -c '[[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]'
          bash scripts/test-bash-compatibility.sh
          bash scripts/test-session-metadata-hook.sh
          bash scripts/test-main-push-gate.sh
      - name: Verify scaffold Markdown whitespace
        run: bash scripts/test-scaffold-markdown-whitespace.sh
      - name: Verify root README seeding and preservation
        run: bash scripts/test-root-readme-seeding.sh
      - name: Verify managed .gitignore handling
        run: bash scripts/test-gitignore-management.sh
      - name: Verify coding standards sync behavior
        run: bash scripts/test-coding-standards-sync.sh
      - name: Verify policy template sync behavior
        run: bash scripts/test-decision-template-sync.sh
      - name: Verify context-log policy sync and migration
        run: bash scripts/test-context-log-policy-sync.sh
      - name: Verify session metadata hook behavior
        run: bash scripts/test-session-metadata-hook.sh
      - name: Verify memory budget pre-commit hook behavior
        run: bash scripts/test-memory-budget-hook.sh
      - name: Verify main push metadata gate
        run: bash scripts/test-main-push-gate.sh
      - name: Verify session-start load contract
        run: bash scripts/test-session-start-load-contract.sh
      - name: Verify agent memory-load measurement fixture
        run: bash scripts/test-agent-memory-load-measurement.sh
      - name: Verify Claude memory-trace parser
        run: bash scripts/test-parse-claude-memory-trace.sh
      - name: Verify path expansion handling
        run: bash scripts/test-path-expansion.sh
      - name: Verify worktree creation helper
        run: bash scripts/test-new-worktree.sh
      - name: Verify worktree removal helper
        run: bash scripts/test-remove-worktree.sh
      - name: Verify worktree helpers on stock Bash 3.2 (macOS)
        if: runner.os == 'macOS'
        env:
          WORKTREE_HELPER_BASH: /bin/bash
        run: |
          /bin/bash -c '[[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]'
          bash scripts/test-new-worktree.sh
          bash scripts/test-remove-worktree.sh
      - name: Verify worktree helper scaffold sync
        run: bash scripts/test-worktree-helper-sync.sh
      - name: Verify memory budget checker
        run: bash scripts/test-check-memory-budget.sh
      - name: Verify context-log budget configuration and scope
        run: bash scripts/test-context-log-size-budget.sh
      - name: Verify byte-based context-log retention and recovery
        run: bash scripts/test-byte-context-log-retention.sh
      - name: Verify deterministic context-log growth contract
        run: bash scripts/test-context-log-growth.sh
      - name: Verify context-log rollover checker
        run: bash scripts/test-check-context-log-rollover.sh
      - name: Verify lessons-archive checker
        run: bash scripts/test-check-lessons-archive.sh
      - name: Verify context-log compactor
        run: bash scripts/test-compact-context-log.sh
      - name: Verify standalone Markdown fence contract
        run: bash scripts/test-markdown-fences.sh
